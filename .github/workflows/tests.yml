name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The unit suite covers the deterministic layer only (no DB, no LLM keys),
      # so it runs without installing the backend's heavy dependencies.
      - name: Run unit tests
        run: npm test
